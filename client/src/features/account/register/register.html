<div class="card bg-base-300 w-1/2 mx-auto flex flex-col p-6 rounded-lg shadow-lg">
  <div class="card-title justify-center text-3xl text-secondary">Sign Up</div>
  <div class="card-body w-full">
    <ul class="steps">
      <li class="step step-primary">Credentials</li>
      <li class="step" [class.step-primary]="currentStep() === 2">Profile</li>
    </ul>
    @if (currentStep() === 1) {
      <form [formGroup]="credentialsForm" class="py-2 flex flex-col gap-4 w-full steps">
        <app-text-input label="Email" formControlName="email" type="email" />
        <app-text-input label="Display Name" formControlName="displayName" />
        <app-text-input label="Password" formControlName="password" type="password" />
        <app-text-input
          label="Confirm Password"
          formControlName="confirmPassword"
          type="password"
        />
        <!-- <select class="w-full select">
        <option disabled selected>Pick a Member</option>
        @for(member of membersFromHome(); track $index){
          <option value="{{member.id}}">{{member.displayName}}</option>
        }
      </select> -->
        <div class="flex items-center justify-end gap-3">
          <button class="btn" type="button" (click)="cancel()">Cancel</button>
          <button
            class="btn btn-primary"
            type="button"
            (click)="nextStep()"
            [disabled]="!credentialsForm.valid"
          >
            Next
          </button>
        </div>
      </form>
    }

    @if (currentStep() === 2) {
      <form [formGroup]="profileForm" class="py-2 flex flex-col w-full gap-4 steps">
        <div class="flex items-center gap-4">Gender:</div>
        <div class="flex gap-3 items-center">
          <label class="flex gap-3 items-center">
            <span>Male</span>
            <input
              class="radio radio-primary"
              name="gender"
              value="male"
              formControlName="gender"
            />
          </label>
          <label class="flex gap-3 items-center">
            <span>Female</span>
            <input
              class="radio radio-primary"
              name="gender"
              value="male"
              formControlName="gender"
            />
          </label>
        </div>
        <app-text-input
          [maxDate]="getMaxDate()"
          class="mt-2"
          type="date"
          label="Date of Birth"
          formControlName="dateOfBirth"
        />
        <app-text-input class="mt-2" label="City" formControlName="city" />
        <app-text-input class="mt-2" label="Country" formControlName="country" />
        <div class="flex items-center justify-end gap-3">
          <button class="btn" type="button" (click)="prevStep()">Back</button>
          <button
            class="btn btn-primary"
            type="button"
            (click)="register()"
            [disabled]="!profileForm.valid"
          >
            Register
          </button>
        </div>
      </form>
    }
  </div>
  @if(validationErrors().length > 0)
  {
    <div class="mt-5 flex bg-gray-2 rounded-2xl w-1/2 p-3 mx-auto">
      <ul class="flex flex-col text-error space-y-1">
        @for(error of validationErrors(); track $index)
        {
          <li>{{ error}}</li>
        }
      </ul>
    </div>
  }
</div>
